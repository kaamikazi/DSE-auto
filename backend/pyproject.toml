[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "dse-autotrader-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.139.0",
  "uvicorn[standard]==0.51.0",
  "pydantic-settings==2.14.2",
  "sqlalchemy==2.0.51",
  "alembic==1.18.5",
  "pandas==2.3.3",
  "numpy==2.5.1",
  "httpx==0.28.1",
  "python-multipart==0.0.32",
  "apscheduler==3.11.3",
  "psycopg[binary]==3.3.4",
  "redis==5.3.1",
]

[project.optional-dependencies]
dev = ["ruff==0.15.21", "mypy==1.20.2"]
test = ["pytest==9.0.3", "pytest-cov==6.3.0"]
providers = ["bdshare==1.2.1"]
locking = ["pip-tools==7.5.3", "pip-audit==2.10.1"]
reports = ["quantstats>=0.0.64"]
postgres = []

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --disable-warnings --strict-markers"
markers = ["integration: requires explicitly configured external PostgreSQL/Redis services"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["B008", "E501"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
