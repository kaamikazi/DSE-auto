name: paper-only verification

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: dse_autotrader_test
          POSTGRES_USER: dse_test
          POSTGRES_PASSWORD: ci-test-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dse_test -d dse_autotrader_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      APP_ENV: test
      TRADING_MODE: paper
      LIVE_TRADING_ENABLED: "false"
      BROKER_ADAPTER: disabled
      DATA_PRIMARY_PROVIDER: mock
      DATA_SECONDARY_PROVIDER: csv
      API_SECRET_KEY: ci-test-secret-not-for-production-32-characters
      REVIEWER_API_SECRET_KEY: ci-reviewer-secret-not-for-production-32-chars
      TEST_POSTGRES_URL: postgresql+psycopg://dse_test:ci-test-only-password@127.0.0.1:5432/dse_autotrader_test
      TEST_REDIS_URL: redis://127.0.0.1:6379/15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements/testing.lock.txt
      - name: Install locked dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --require-hashes -r requirements/testing.lock.txt
          python -m pip install --no-deps -e .
      - name: Verify paper-only settings
        run: python -c "from app.core.config import get_settings; s=get_settings(); assert s.TRADING_MODE == 'paper' and not s.LIVE_TRADING_ENABLED and s.BROKER_ADAPTER == 'disabled'"
      - name: Ruff format
        run: ruff format --check app tests ../scripts/initialize_evidence_workspace.py
      - name: Ruff lint
        run: ruff check app tests ../scripts
      - name: Strict mypy
        run: mypy --strict --no-incremental app ../scripts/initialize_evidence_workspace.py
      - name: Alembic clean migration cycle
        env:
          DATABASE_URL: sqlite:////tmp/dse-ci-migrations.db
        run: |
          alembic upgrade 0011
          alembic downgrade 0010
          alembic upgrade 0011
          test "$(alembic current | tail -n 1)" = "0011 (head)"
      - name: Full backend tests with PostgreSQL and Redis
        run: pytest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
      - run: npm audit --audit-level=high

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
