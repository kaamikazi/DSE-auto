name: paper-only verification

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  paper-only:
    runs-on: ubuntu-latest
    env:
      APP_ENV: test
      DATABASE_URL: sqlite:////tmp/dse-public-ci.db
      DATABASE_ROLE: test
      ALLOW_DATABASE_ROLE_OVERRIDE: "false"
      TRADING_MODE: paper
      LIVE_TRADING_ENABLED: "false"
      BROKER_ADAPTER: disabled
      DATA_PRIMARY_PROVIDER: mock
      DATA_SECONDARY_PROVIDER: csv
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements/testing.lock.txt

      - name: Install locked dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --require-hashes -r requirements/testing.lock.txt
          python -m pip install --no-deps -e .

      - name: Verify fail-closed paper-only settings
        run: >-
          python -c "from app.core.config import assert_paper_only_safety, get_settings;
          s = get_settings(); assert s.APP_ENV == 'test'; assert s.DATABASE_ROLE == 'test';
          assert not s.ALLOW_DATABASE_ROLE_OVERRIDE; assert_paper_only_safety(s)"

      - name: Focused public-safe tests
        run: pytest tests/test_public_ci_safety.py tests/test_minimal_v1.py

      - name: Ruff format
        run: >-
          ruff format --check app/core/config.py app/core/database_identity.py
          app/brokers/base.py app/services/minimal_v1.py
          tests/test_public_ci_safety.py tests/test_minimal_v1.py

      - name: Ruff lint
        run: >-
          ruff check app/core/config.py app/core/database_identity.py
          app/brokers/base.py app/services/minimal_v1.py
          tests/test_public_ci_safety.py tests/test_minimal_v1.py

      - name: Strict focused mypy
        run: >-
          mypy --strict --no-incremental app/core/config.py
          app/core/database_identity.py app/brokers/base.py
          app/services/minimal_v1.py tests/test_public_ci_safety.py
