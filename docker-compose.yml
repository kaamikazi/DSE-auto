services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: dse_autotrader
      POSTGRES_USER: dse
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-development-only}
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U dse"], interval: 5s, timeout: 3s, retries: 10 }
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes: [redis_data:/data]
  backend:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://dse:${POSTGRES_PASSWORD:-local-development-only}@db:5432/dse_autotrader
      REDIS_URL: redis://redis:6379/0
    ports: ["8000:8000"]
    depends_on:
      db: { condition: service_healthy }
  frontend:
    build: ./frontend
    environment: { NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1 }
    ports: ["3000:3000"]
    depends_on: [backend]
volumes: { postgres_data: {}, redis_data: {} }

